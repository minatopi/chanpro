<!doctype html>
<html lang=ja>

<head>
    <meta charset=UTF-8>
    <meta name=viewport content="width=device-width,initial-scale=1">
    <title>chanpro-Post</title>
    <link rel=icon type=image/png
        href=https://qiita-image-store.s3.ap-northeast-1.amazonaws.com/0/4422522/32d91302-ff79-4e42-b0f3-866c7c1427d5.png>
    <script src=https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2></script>
    <script src=https://unpkg.com/mqtt/dist/mqtt.min.js></script>
    <style>
        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f7f9fa;
            color: #0f1419
        }

        button,
        input,
        textarea {
            font: inherit
        }

        button {
            cursor: pointer
        }

        .hidden {
            display: none !important
        }

        .app {
            display: grid;
            grid-template-columns: 260px minmax(0, 650px) 320px;
            max-width: 1250px;
            margin: auto;
            min-height: 100vh
        }

        .sidebar {
            position: sticky;
            top: 0;
            height: 100vh;
            padding: 20px;
            border-right: 1px solid #e1e8ed;
            background: #fff
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            color: #1d9bf0;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 10px
        }

        .logo img {
            height: 50px;
            width: auto
        }

        @media (max-width:600px) {
            .logo span {
                display: none
            }
        }

        .nav button {
            display: block;
            width: 100%;
            text-align: left;
            border: 0;
            background: 0 0;
            padding: 13px 15px;
            border-radius: 25px;
            margin: 4px 0;
            font-size: 16px
        }

        .nav button:hover {
            background: #eef7fd
        }

        .postButton {
            width: 100%;
            border: 0;
            background: #1d9bf0;
            color: #fff;
            padding: 13px;
            border-radius: 25px;
            font-weight: 700;
            margin-top: 20px
        }

        .postButtonRow {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-top: 20px
        }

        .postButtonRow .postButton {
            flex: 1;
            margin-top: 0
        }

        .lineLinkButton {
            min-width: 48px;
            border: 1px solid #06c755;
            background: #fff;
            color: #06c755;
            border-radius: 10px;
            font-size: 20px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0
        }

        .lineLinkButton:hover {
            background: #ecfdf5
        }

        .lineLinkButton.hidden {
            display: none !important
        }

        .lineLinkModal {
            max-width: 560px
        }

        .lineLinkModal h2 {
            margin: 0 0 8px
        }

        .lineLinkModalDesc {
            color: #536471;
            font-size: 14px;
            line-height: 1.7;
            margin-bottom: 16px
        }

        .lineLinkStep {
            padding: 16px;
            background: #f7f9fa;
            border: 1px solid #e1e8ed;
            border-radius: 14px;
            margin-top: 12px
        }

        .lineLinkStepTitle {
            font-weight: 800;
            margin-bottom: 7px
        }

        .lineLinkStepText {
            color: #536471;
            font-size: 13px;
            line-height: 1.7
        }

        .lineLinkQr {
            display: block;
            width: 190px;
            height: 190px;
            object-fit: contain;
            margin: 12px auto
        }

        .lineLinkOpen {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 44px;
            background: #06c755;
            color: #fff;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 700;
            margin-bottom: 8px
        }

        .lineLinkCode {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 2px;
            text-align: center;
            font-family: Consolas, "Courier New", monospace;
            margin: 12px 0;
            word-break: break-all
        }

        .lineLinkStatus {
            text-align: center;
            color: #536471;
            font-size: 13px;
            margin-top: 12px
        }

        .lineLinkSuccess {
            padding: 12px;
            border-radius: 10px;
            background: #ecfdf5;
            border: 1px solid #a7f3d0;
            color: #065f46;
            line-height: 1.6
        }

        .main {
            min-width: 0;
            border-right: 1px solid #e1e8ed;
            background: #fff
        }

        .pageHeader {
            position: sticky;
            top: 0;
            z-index: 10;
            background: rgba(255, 255, 255, .94);
            backdrop-filter: blur(8px);
            padding: 15px;
            border-bottom: 1px solid #e1e8ed;
            font-weight: 800
        }

        .composer {
            padding: 15px;
            border-bottom: 1px solid #e1e8ed
        }

        .composer textarea {
            width: 100%;
            min-height: 90px;
            border: 0;
            outline: 0;
            resize: none;
            font-size: 18px
        }

        .composer input {
            width: 100%;
            border: 1px solid #cfd9de;
            border-radius: 10px;
            padding: 10px;
            margin-top: 8px
        }

        .composerBottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px
        }

        .primary {
            background: #1d9bf0;
            color: #fff;
            border: 0;
            border-radius: 22px;
            padding: 9px 18px;
            font-weight: 700
        }

        .secondary {
            background: #fff;
            color: #0f1419;
            border: 1px solid #cfd9de;
            border-radius: 22px;
            padding: 8px 15px;
            font-weight: 700
        }

        .danger {
            background: #f4212e;
            color: #fff;
            border: 0;
            border-radius: 20px;
            padding: 8px 15px
        }

        .post {
            padding: 15px;
            border-bottom: 1px solid #e1e8ed;
            transition: .15s
        }

        .post:hover {
            background: #fafafa
        }

        .postHead {
            display: flex;
            gap: 10px
        }

        .avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            background: #ddd
        }

        .postUser {
            font-weight: 700
        }

        .handle {
            color: #536471;
            font-size: 14px
        }

        .postText {
            margin: 8px 0;
            white-space: pre-wrap;
            word-break: break-word;
            cursor: pointer
        }

        .postLinkPreviews {
            margin: 10px 0
        }

        .postLinkPreviews a {
            cursor: pointer
        }

        .postImage {
            width: 100%;
            max-height: 450px;
            object-fit: cover;
            border-radius: 15px;
            margin-top: 8px;
            border: 1px solid #e1e8ed
        }

        .postViewCount:hover {
            background: #eef3f5
        }

        .detailViewCount {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            min-width: 58px;
            height: 32px;
            padding: 0 10px;
            border: 1px solid #e1e8ed;
            border-radius: 16px;
            background: #f7f9fa;
            color: #536471;
            font-size: 13px;
            line-height: 1;
            box-sizing: border-box
        }

        .detailViewCount svg {
            width: 17px;
            height: 17px;
            display: block;
            flex: none
        }

        .detailViewCount span {
            line-height: 1;
            white-space: nowrap
        }

        .postViewRow {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            width: 100%;
            margin-top: 6px;
            padding-top: 4px
        }

        .postViewRow {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            width: 100%;
            margin-top: 4px;
            padding-top: 2px
        }

        .postViewCount {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            min-width: 50px;
            height: 27px;
            padding: 0 8px;
            border: 1px solid #e1e8ed;
            border-radius: 14px;
            background: #f7f9fa;
            color: #536471;
            font-size: 12px;
            line-height: 1;
            box-sizing: border-box;
            white-space: nowrap
        }

        .postViewCount svg {
            width: 15px;
            height: 15px;
            display: block;
            flex: none
        }

        .postViewCount span {
            display: block;
            line-height: 1
        }

        .detailMeta {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #536471;
            font-size: 14px;
            padding: 8px 0;
            border-top: 1px solid #e1e8ed;
            border-bottom: 1px solid #e1e8ed;
            margin-top: 10px
        }

        .detailViewCount {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            min-width: 52px;
            height: 28px;
            padding: 0 8px;
            border: 1px solid #e1e8ed;
            border-radius: 14px;
            background: #f7f9fa;
            color: #536471;
            font-size: 12px;
            line-height: 1;
            box-sizing: border-box;
            white-space: nowrap
        }

        .detailViewCount svg {
            width: 15px;
            height: 15px;
            display: block;
            flex: none
        }

        .detailViewCount span {
            line-height: 1
        }

        .detailMeta {
            display: flex;
            gap: 14px;
            align-items: center;
            color: #536471;
            font-size: 14px;
            margin-top: 12px
        }

        .postActions {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            color: #536471
        }

        .action {
            border: 0;
            background: 0 0;
            color: #536471;
            padding: 6px
        }

        .action:hover {
            color: #1d9bf0
        }

        .action.liked {
            color: #f91880
        }

        .action.reposted {
            color: #00ba7c
        }

        .rightbar {
            padding: 15px
        }

        .search {
            width: 100%;
            border: 0;
            background: #eff3f4;
            border-radius: 25px;
            padding: 12px 18px;
            outline: 0
        }

        .card {
            background: #f7f9f9;
            border-radius: 18px;
            padding: 15px;
            margin-top: 15px
        }

        .card h3 {
            margin-top: 0
        }

        .trend {
            padding: 9px 0;
            border-bottom: 1px solid #e1e8ed;
            cursor: pointer
        }

        .trend small {
            display: block;
            color: #536471
        }

        .userRow {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 0
        }

        .userRowInfo {
            flex: 1
        }

        .modal {
            position: fixed;
            inset: 0;
            z-index: 900;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(0, 0, 0, .45);
            overflow: auto
        }

        .modal.is-open {
            display: flex
        }

        .modalBox {
            background: #fff;
            border-radius: 18px;
            width: 100%;
            max-height: 90vh;
            overflow: auto;
            padding: 20px
        }

        .modalBox input,
        .modalBox textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #cfd9de;
            border-radius: 10px;
            margin: 7px 0
        }

        .profileCover {
            height: 180px;
            background: linear-gradient(135deg, #1d9bf0, #7856ff)
        }

        .profileInfo {
            padding: 15px
        }

        .profileBigAvatar {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid #fff;
            margin-top: -55px
        }

        .profileActions {
            float: right;
            margin-top: 10px
        }

        .profileHandle {
            color: #536471
        }

        .profileBio {
            margin-top: 12px;
            white-space: pre-wrap
        }

        .profileStats {
            display: flex;
            gap: 25px;
            margin-top: 15px
        }

        .profileStats div {
            display: flex;
            flex-direction: column
        }

        .profileStats span {
            color: #536471;
            font-size: 13px
        }

        .notification {
            padding: 15px;
            border-bottom: 1px solid #e1e8ed
        }

        .unread {
            background: #eef7fd
        }

        .dmList {
            border-bottom: 1px solid #e1e8ed
        }

        .dmUser {
            padding: 12px;
            border-bottom: 1px solid #e1e8ed;
            cursor: pointer
        }

        .dmMessages {
            height: 350px;
            overflow: auto;
            padding: 10px;
            background: #f7f9fa
        }

        .dmMessage {
            padding: 8px 12px;
            border-radius: 15px;
            background: #e8f1ff;
            margin: 5px;
            max-width: 75%
        }

        .dmMessage.me {
            margin-left: auto;
            background: #d9ffd9
        }

        .admin {
            padding: 15px
        }

        .adminRow {
            padding: 12px;
            border-bottom: 1px solid #e1e8ed
        }

        .empty {
            padding: 40px 20px;
            text-align: center;
            color: #536471
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #0f1419;
            color: #fff;
            padding: 12px 20px;
            border-radius: 25px;
            z-index: 1000
        }

        @media(max-width:1000px) {
            .app {
                grid-template-columns: 80px minmax(0, 650px) 0
            }

            .rightbar {
                display: none
            }

            .logo {
                font-size: 0
            }

            .logo:after {
                content: "CP";
                font-size: 22px
            }

            .nav button {
                font-size: 0;
                text-align: center
            }

            .nav button:first-letter {
                font-size: 22px
            }
        }

        @media(max-width:650px) {
            .app {
                display: block
            }

            .sidebar {
                position: fixed;
                bottom: 0;
                top: auto;
                height: 60px;
                width: 100%;
                z-index: 50;
                padding: 5px;
                border-top: 1px solid #e1e8ed;
                border-right: 0
            }

            .logo,
            .postButton {
                display: none
            }

            .nav {
                display: flex;
                justify-content: space-around
            }

            .nav button {
                margin: 0;
                width: auto;
                padding: 10px
            }

            .main {
                padding-bottom: 60px
            }
        }

        .profileStatClickable {
            cursor: pointer
        }

        .profileStatClickable:hover b,
        .profileStatClickable:hover span {
            color: #1d9bf0
        }

        .profileCover {
            height: 180px;
            background-color: #1d9bf0;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat
        }

        .detailBack {
            display: flex;
            align-items: center;
            gap: 15px
        }

        .detailBack button {
            font-size: 20px;
            padding: 4px 10px
        }

        .detailPostWrap {
            border-bottom: 1px solid #e1e8ed;
            padding: 15px
        }

        .detailPostText {
            font-size: 20px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
            margin: 10px 0
        }

        .detailMeta {
            color: #536471;
            font-size: 14px;
            padding: 8px 0;
            border-top: 1px solid #e1e8ed;
            border-bottom: 1px solid #e1e8ed;
            margin-top: 10px
        }

        .detailViewCount {
            display: inline-flex;
            align-items: center;
            gap: 5px
        }

        .detailViewCount svg {
            width: 16px;
            height: 16px;
            display: inline-block;
            flex: none
        }

        .detailComposer {
            padding: 15px;
            border-bottom: 1px solid #e1e8ed
        }

        .detailComposer textarea {
            width: 100%;
            min-height: 80px;
            border: 0;
            outline: 0;
            resize: none;
            font-size: 17px;
            padding: 8px 0
        }

        .reply {
            padding: 12px 15px;
            border-bottom: 1px solid #e1e8ed
        }

        .replyHead {
            display: flex;
            gap: 10px
        }

        .replyAvatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            background: #ddd;
            cursor: pointer
        }

        .replyBody {
            flex: 1;
            min-width: 0
        }

        .replyUser {
            font-weight: 700;
            cursor: pointer
        }

        .replyText {
            margin: 4px 0;
            white-space: pre-wrap;
            word-break: break-word
        }

        .replyActions {
            display: flex;
            gap: 18px;
            margin-top: 6px;
            color: #536471;
            font-size: 13px
        }

        .replyActions button {
            border: 0;
            background: 0 0;
            color: #536471;
            padding: 4px 6px;
            border-radius: 14px
        }

        .replyActions button:hover {
            color: #1d9bf0;
            background: #eef7fd
        }

        .replyChildren {
            margin-left: 30px;
            border-left: 2px solid #e1e8ed;
            padding-left: 10px;
            margin-top: 8px
        }

        .replyComposerInline {
            padding: 10px;
            background: #f7f9fa;
            border-bottom: 1px solid #e1e8ed
        }

        .replyComposerInline textarea {
            width: 100%;
            min-height: 60px;
            border: 1px solid #cfd9de;
            border-radius: 12px;
            padding: 8px;
            outline: 0;
            resize: none
        }

        .replyToHint {
            color: #1d9bf0;
            font-size: 13px;
            margin-bottom: 4px
        }

        .navNotification {
            position: relative
        }

        .notificationDot {
            position: absolute;
            top: 0;
            right: 0;
            width: 15px;
            height: 15px;
            background: #f4212e;
            border-radius: 50%;
            border: 2px solid #fff
        }

        button img {
            width: 20px;
            height: 20px;
            object-fit: contain;
            vertical-align: middle;
            margin-right: 6px
        }

        .profileMusicSection {
            margin-top: 18px;
            padding: 16px;
            border: 1px solid #e1e8ed;
            border-radius: 16px;
            background: #f8fafb
        }

        .profileMusicHeader {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 12px
        }

        .profileMusicTitle {
            font-size: 17px;
            font-weight: 800
        }

        .profileMusicSub {
            color: #536471;
            font-size: 13px;
            margin-top: 3px
        }

        .profileMusicEmpty {
            padding: 14px;
            text-align: center;
            color: #536471;
            background: #fff;
            border-radius: 12px;
            border: 1px dashed #cfd9de
        }

        .profileMusicCard {
            background: #fff;
            border: 1px solid #e1e8ed;
            border-radius: 14px;
            padding: 14px
        }

        .profileMusicInfo {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0
        }

        .profileMusicIcon {
            width: 48px;
            height: 48px;
            min-width: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1d9bf0, #7856ff);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 23px
        }

        .profileMusicName {
            font-weight: 700;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap
        }

        .profileMusicSize {
            color: #536471;
            font-size: 12px;
            margin-top: 3px
        }

        .profileMusicControls {
            display: flex;
            gap: 8px;
            margin-top: 12px
        }

        .profileMusicPlayButton {
            flex: 1;

            border-radius: 22px;
            padding: 9px 14px;
            font-weight: 700
        }

        .profileMusicPlayButton:hover {
            background: #1688d8
        }

        .profileMusicStopButton {
            border: 1px solid #cfd9de;
            background: #fff;

        }

        .profileMusicDrop {
            margin-top: 10px;
            border: 2px dashed #cfd9de;

        }

            background: #eef7fd

        .profileMusicDrop strong {
            display: block;

        }

        .profileMusicDrop small {

        .profileMusicProgressWrap {

        }

        .profileMusicProgressWrap.show {

            height: 8px;
            background: #e1e8ed;
            border-radius: 99px;

        }

            width: 0%;
            height: 100%;
            background: #1d9bf0;
            transition: width .15s
        }

        .profileMusicProgressText {
            margin-top: 5px;
            font-size: 12px;
            color: #536471;
            text-align: center
        }

        .profileMusicFileInput {
            display: none
        }

        .profileMusicDanger {
            border: 1px solid #f4212e;
            background: #fff;
            color: #f4212e;
            border-radius: 22px;
            padding: 8px 13px;
            font-weight: 700
        }

        .profileMusicDanger:hover {
            background: #fff1f2
        }

        .profileMusicModalInfo {
            padding: 10px 12px;
            background: #f7f9fa;
            border-radius: 10px;
            margin-bottom: 12px;
            font-size: 13px;
            color: #536471
        }

        .profileMusicCurrent {
            margin-bottom: 12px
        }

        .profileMusicCurrentLabel {
            font-size: 12px;
            color: #536471;
            margin-bottom: 5px
        }

        .profileMusicUploadLabel {
            display: block;
            font-size: 14px;
            font-weight: 700;
            margin-top: 12px
        }
